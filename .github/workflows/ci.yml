name: Web checks
on:
  pull_request:
  push:
    branches: [master]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: npx --yes firebase-tools@13.35.1 emulators:exec --only firestore --project demo-swahilipro 'npm run test:firestore'
      - run: npm run typecheck
      - run: npm run build
